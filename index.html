<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <title>SRI REAL TIME — Enterprise Systems, AI Automation & Digital Engineering</title>

    content="SRI REAL TIME designs, builds and deploys enterprise-grade digital systems — ERP, CRM, SCM, Inventory and MIS platforms, AI automation, and mobile and web products engineered to scale." />
  <meta name="author" content="SRI REAL TIME" />
  <meta name="theme-color" content="#04070F" />
  <link rel="canonical" href="https://srirealtime.com/" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="SRI REAL TIME" />
  <meta property="og:title" content="SRI REAL TIME — Enterprise Systems, AI Automation & Digital Engineering" />
  <meta property="og:description"
    content="Enterprise-grade digital systems, AI automation and custom software engineering. ERP, CRM, SCM, MIS, e-commerce, mobile and web — built to scale." />
  <meta property="og:url" content="https://srirealtime.com/" />
  <meta property="og:image" content="https://srirealtime.com/logo.png" />
  <meta property="og:locale" content="en_US" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="SRI REAL TIME — Enterprise Systems, AI Automation & Digital Engineering" />
  <meta name="twitter:description"
    content="Enterprise-grade digital systems, AI automation and custom software engineering, built to scale." />
  <meta name="twitter:image" content="https://srirealtime.com/logo.png" />

  <link rel="icon" type="image/png" href="/logo.png" />
  <link rel="apple-touch-icon" href="/logo.png" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
    rel="stylesheet" />

  <!-- Structured data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "SRI REAL TIME",
    "url": "https://srirealtime.com",
    "logo": "https://srirealtime.com/logo.png",
    "email": "org@srirealtime.com",
    "description": "Full-service technology company specialising in enterprise-grade digital systems, AI automation and custom software engineering.",
    "address": {
      "@type": "PostalAddress",
      "addressLocality": "Coimbatore",
      "addressCountry": "IN"
    },
    "knowsAbout": [
      "Enterprise Resource Planning",
      "Customer Relationship Management",
      "Supply Chain Management",
      "Management Information Systems",
      "Artificial Intelligence Integration",
      "Mobile Application Development",
      "Cloud Architecture"
    ]
  }
  </script>

  <!-- Apply the saved theme before first paint to avoid a flash -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('sri_a11y_settings');
        var dark = saved
          ? JSON.parse(saved).darkMode
          : !window.matchMedia('(prefers-color-scheme: light)').matches;
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) { /* first visit, or storage blocked */ }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
